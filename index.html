<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05010d">
  <meta name="description" content="Um universo feito para a menina lua.">
  <title>Para Você, Menina Lua</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <canvas id="universe" class="universe" aria-label="Universo com um coração no centro e nossas fotos girando em volta" role="img"></canvas>

  <header class="top">
    <p id="title" class="top__title fade">Eu te amo, menina lua 🌙</p>
    <div id="counter" class="counter fade" aria-live="off">
      <p id="counter-label" class="counter__label"></p>
      <p id="counter-value" class="counter__value"></p>
    </div>
  </header>

  <p id="hint" class="hint fade">Toque duas vezes no coração pra ler de perto 💗<br>Arraste pra girar · Toque nas fotos 💫</p>
  <button id="letter-open" class="letter-open fade" type="button">💌 Uma carta pra você</button>
  <button id="music-toggle" class="music-toggle fade" type="button" aria-label="Pausar música">♫</button>

  <section id="intro" class="intro">
    <h1 class="intro__title">Para você,<br>menina lua</h1>
    <p class="intro__subtitle">fiz um universo só nosso</p>
    <button id="intro-start" class="intro__button" type="button">Toque aqui ❤️</button>
  </section>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Foto" aria-hidden="true">
    <div id="viewer-hearts" class="viewer__hearts" aria-hidden="true"></div>
    <button id="viewer-close" class="viewer__close" type="button" aria-label="Fechar">✕</button>
    <figure class="viewer__card">
      <div class="viewer__frame"><img id="viewer-image" class="viewer__image" alt=""></div>
      <figcaption>
        <blockquote id="viewer-quote" class="viewer__quote"></blockquote>
        <p id="viewer-source" class="viewer__source"></p>
      </figcaption>
    </figure>
    <button id="viewer-prev" class="viewer__nav viewer__nav--prev" type="button" aria-label="Foto anterior">‹</button>
    <button id="viewer-next" class="viewer__nav viewer__nav--next" type="button" aria-label="Próxima foto">›</button>
    <p class="viewer__tip">deslize pro lado pra ver a próxima · toque fora pra voltar</p>
  </div>

  <div id="letter" class="letter" role="dialog" aria-modal="true" aria-label="Carta" aria-hidden="true">
    <button id="letter-close" class="letter__close" type="button" aria-label="Fechar carta">✕</button>
    <article class="letter__paper">
      <span class="letter__seal" aria-hidden="true">💌</span>
      <p id="letter-text" class="letter__text"></p>
      <p id="letter-skip" class="letter__skip">toque na carta pra mostrar tudo</p>
    </article>
  </div>

  <noscript><p class="noscript">Ative o JavaScript para ver 💖</p></noscript>
</body>
</html>
